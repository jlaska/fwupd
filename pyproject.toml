[project]
name = "fwupd-container"
version = "1.0.0"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
